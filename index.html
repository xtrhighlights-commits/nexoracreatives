
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Creatives | Identity that Inspires</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: "#8c25f4",
                        "bg-dark": "#0a060e",
                        "surface": "#16111d",
                        "border-muted": "rgba(140, 37, 244, 0.2)"
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0a060e;
            color: #fff;
            scrollbar-width: thin;
            scrollbar-color: #8c25f4 #0a060e;
        }
        .glass {
            background: rgba(26, 16, 35, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .purple-glow {
            box-shadow: 0 0 40px -10px rgba(140, 37, 244, 0.3);
        }
        .mesh-gradient {
            background-image: 
                radial-gradient(at 0% 0%, rgba(140, 37, 244, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(140, 37, 244, 0.05) 0px, transparent 50%);
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="mesh-gradient min-h-screen">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
